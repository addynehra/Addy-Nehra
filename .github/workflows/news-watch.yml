name: News Watch

on:
  schedule:
    # ~20:00 UTC daily = ~6am AEST / 7am AEDT Sydney (shifts with daylight saving)
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-watch
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run news watch
        run: node scripts/news-watch.mjs

      - name: Commit results if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news-results.json
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git commit -m "Update news watch results"
            git push
          fi
